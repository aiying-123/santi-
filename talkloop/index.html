<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#050607"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>TalkLoop</title><style>html,body{margin:0;width:100%;height:100%;background:#050607;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif}#boot{position:fixed;inset:0;display:grid;place-items:center;background:#050607;color:#8690a0;font-size:12px}</style></head><body><div id="boot">TalkLoop loading…</div><script>(async()=>{try{if(!('DecompressionStream'in window))throw new Error('当前浏览器缺少解压能力');const parts=await Promise.all([...Array(7)].map((_,i)=>fetch('./payload/p'+i+'.txt?v=5.0.1').then(r=>{if(!r.ok)throw new Error('资源 '+i+' 加载失败');return r.text()})));const b=parts.join('').trim(),u=Uint8Array.from(atob(b),c=>c.charCodeAt(0)),ds=new DecompressionStream('gzip'),txt=await new Response(new Blob([u]).stream().pipeThrough(ds)).text();document.open();document.write(txt);document.close()}catch(e){document.getElementById('boot').textContent='TalkLoop 启动失败，请刷新页面：'+e.message}})();</script></body></html>
