<!doctype html>
<html lang="zh-CN">

<title>三体物理模拟 · Generative Art</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}canvas{display:block;width:100%;height:100%;touch-action:none}#hud{position:fixed;z-index:5;left:max(14px,env(safe-area-inset-left));top:max(12px,env(safe-area-inset-top));pointer-events:none;text-shadow:0 0 18px rgba(70,190,255,.55)}#hud b{font-size:14px;letter-spacing:.13em}#hud span{display:block;margin-top:5px;font-size:10px;line-height:1.5;color:rgba(220,235,255,.55)}#err{display:none;position:fixed;z-index:20;left:50%;top:50%;transform:translate(-50%,-50%);width:min(88vw,420px);padding:18px;border:1px solid rgba(120,190,255,.2);border-radius:16px;background:rgba(4,8,18,.9);font-size:13px;line-height:1.6}.lil-gui.root{top:max(8px,env(safe-area-inset-top))!important;right:max(8px,env(safe-area-inset-right))!important;max-height:calc(100vh - 20px);overflow:auto}@media(max-width:600px){.lil-gui.root{--width:250px;font-size:11px}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/Pass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>

<body>
<div id="hud"><b>THREE-BODY / 三体</b><span>单指旋转 · 双指缩放/平移<br>RK4 · Gravity Softening · Bloom</span></div><div id="err"></div>
<script>
(function(){'use strict';
var err=document.getElementById('err');function fail(s){err.style.display='block';err.innerHTML='<b>无法启动</b><br>'+s}if(!window.THREE){fail('Three.js 未加载，请联网后用 Safari 打开。');return}if(!THREE.OrbitControls||!THREE.EffectComposer||!THREE.UnrealBloomPass){fail('Three.js 后处理组件未加载，请刷新页面。');return}
var scene=new THREE.Scene();scene.background=new THREE.Color(0);scene.fog=new THREE.FogExp2(0,0.0025);
var camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,.05,2200);camera.position.set(0,24,72);
var renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.6));renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1;document.body.appendChild(renderer.domElement);
var controls=new THREE.OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.055;controls.minDistance=8;controls.maxDistance=400;controls.target.set(0,0,0);
var composer=new THREE.EffectComposer(renderer);composer.addPass(new THREE.RenderPass(scene,camera));var bloom=new THREE.UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),2,.62,.05);composer.addPass(bloom);
function stars(n,R){var g=new THREE.BufferGeometry(),p=new Float32Array(n*3);for(var i=0;i<n;i++){var r=R*Math.pow(Math.random(),.38),t=Math.random()*Math.PI*2,f=Math.acos(2*Math.random()-1);p[i*3]=r*Math.sin(f)*Math.cos(t);p[i*3+1]=r*Math.cos(f);p[i*3+2]=r*Math.sin(f)*Math.sin(t)}g.setAttribute('position',new THREE.BufferAttribute(p,3));var x=new THREE.Points(g,new THREE.PointsMaterial({color:0xbfd9ff,size:.55,transparent:true,opacity:.72,depthWrite:false}));scene.add(x);return x}var starfield=stars(innerWidth<700?900:1500,500);scene.add(new THREE.AmbientLight(0x5577aa,.65));
var P={G:7,softening:.85,timeScale:1,fixedDt:1/180,trailLength:innerWidth<700?520:850,sampleEvery:2,bodyScale:.52,pause:false,autoRotate:false,bloomStrength:2,bloomRadius:.62,bloomThreshold:.05,exposure:1,randomize:function(){randomize()},reset:function(){reset()},clearTrails:function(){clearTrails()}};
var C=[{name:'A',mass:22,vx:0,vy:1.6,vz:2.6,color:0x47d7ff},{name:'B',mass:18,vx:-.35,vy:-1.2,vz:-2.3,color:0xff3ca6},{name:'C',mass:8,vx:1.85,vy:-.15,vz:.15,color:0xffc04a}],IP=[new THREE.Vector3(-13,0,0),new THREE.Vector3(11,0,0),new THREE.Vector3(0,13,2)],sg=new THREE.SphereGeometry(1,32,24),hg=new THREE.SphereGeometry(1,24,18);
var B=C.map(function(c,i){var m=new THREE.MeshStandardMaterial({color:c.color,emissive:c.color,emissiveIntensity:4.5,roughness:.32,metalness:.15}),mesh=new THREE.Mesh(sg,m);scene.add(mesh);var hm=new THREE.MeshBasicMaterial({color:c.color,transparent:true,opacity:.09,blending:THREE.AdditiveBlending,depthWrite:false}),halo=new THREE.Mesh(hg,hm);scene.add(halo);return{config:c,pos:IP[i].clone(),vel:new THREE.Vector3(c.vx,c.vy,c.vz),mesh:mesh,halo:halo}});
var vs='attribute float alpha;varying float vAlpha;void main(){vAlpha=alpha;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',fs='uniform vec3 uColor;varying float vAlpha;void main(){float a=pow(vAlpha,1.6);gl_FragColor=vec4(uColor*(1.3+2.0*a),a*.76);}';
function Trail(c){this.c=new THREE.Color(c);this.p=[];this.g=new THREE.BufferGeometry();this.m=new THREE.ShaderMaterial({uniforms:{uColor:{value:this.c}},vertexShader:vs,fragmentShader:fs,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false});this.l=new THREE.Line(this.g,this.m);this.l.frustumCulled=false;scene.add(this.l)}Trail.prototype.add=function(v){this.p.push(v.clone());var max=Math.max(30,P.trailLength|0);if(this.p.length>max)this.p.splice(0,this.p.length-max);this.rebuild()};Trail.prototype.rebuild=function(){var n=this.p.length;if(n<2){this.g.setDrawRange(0,0);return}var p=new Float32Array(n*3),a=new Float32Array(n);for(var i=0;i<n;i++){var q=this.p[i],t=i/Math.max(1,n-1);p[i*3]=q.x;p[i*3+1]=q.y;p[i*3+2]=q.z;a[i]=Math.pow(t,2)}this.g.setAttribute('position',new THREE.BufferAttribute(p,3));this.g.setAttribute('alpha',new THREE.BufferAttribute(a,1));this.g.setDrawRange(0,n);this.g.computeBoundingSphere()};Trail.prototype.clear=function(){this.p.length=0;this.g.setDrawRange(0,0)};var T=C.map(function(c){return new Trail(c.color)});
function acc(pos){var out=pos.map(function(){return new THREE.Vector3()}),e2=P.softening*P.softening;for(var i=0;i<pos.length;i++)for(var j=i+1;j<pos.length;j++){var r=new THREE.Vector3().subVectors(pos[j],pos[i]),d2=r.lengthSq()+e2,iv=1/Math.sqrt(d2),k=P.G*iv*iv*iv;out[i].add(r.clone().multiplyScalar(k*B[j].config.mass));out[j].add(r.clone().multiplyScalar(-k*B[i].config.mass))}return out}function cl(v){return v.clone()}
function rk4(dt){var p0=B.map(function(b){return b.pos.clone()}),v0=B.map(function(b){return b.vel.clone()}),a1=acc(p0),kp1=v0.map(cl),kv1=a1.map(cl),p2=p0.map(function(p,i){return p.clone().addScaledVector(kp1[i],dt*.5)}),v2=v0.map(function(v,i){return v.clone().addScaledVector(kv1[i],dt*.5)}),a2=acc(p2),kp2=v2.map(cl),kv2=a2.map(cl),p3=p0.map(function(p,i){return p.clone().addScaledVector(kp2[i],dt*.5)}),v3=v0.map(function(v,i){return v.clone().addScaledVector(kv2[i],dt*.5)}),a3=acc(p3),kp3=v3.map(cl),kv3=a3.map(cl),p4=p0.map(function(p,i){return p.clone().addScaledVector(kp3[i],dt)}),v4=v0.map(function(v,i){return v.clone().addScaledVector(kv3[i],dt)}),a4=acc(p4),kp4=v4.map(cl),kv4=a4.map(cl);for(var i=0;i<B.length;i++){B[i].pos.add(kp1[i].clone().addScaledVector(kp2[i],2).addScaledVector(kp3[i],2).add(kp4[i]).multiplyScalar(dt/6));B[i].vel.add(kv1[i].clone().addScaledVector(kv2[i],2).addScaledVector(kv3[i],2).add(kv4[i]).multiplyScalar(dt/6))}}
function centerM(){var m=0,p=new THREE.Vector3();B.forEach(function(b){m+=b.config.mass;p.addScaledVector(b.vel,b.config.mass)});p.multiplyScalar(1/m);B.forEach(function(b){b.vel.sub(p)})}function centerP(){var m=0,p=new THREE.Vector3();B.forEach(function(b){m+=b.config.mass;p.addScaledVector(b.pos,b.config.mass)});p.multiplyScalar(1/m);B.forEach(function(b){b.pos.sub(p)})}function syncCfg(){B.forEach(function(b,i){C[i].vx=b.vel.x;C[i].vy=b.vel.y;C[i].vz=b.vel.z});if(gui&&gui.controllersRecursive)gui.controllersRecursive().forEach(function(x){x.updateDisplay()})}function applyV(){B.forEach(function(b,i){b.vel.set(C[i].vx,C[i].vy,C[i].vz)});centerM();syncCfg()}var tick=0;function clearTrails(){T.forEach(function(t){t.clear()});tick=0}function reset(){B.forEach(function(b,i){b.pos.copy(IP[i]);b.vel.set(C[i].vx,C[i].vy,C[i].vz)});centerP();centerM();clearTrails();syncCfg()}function unit(){var v;do{v=new THREE.Vector3(Math.random()*2-1,Math.random()*2-1,Math.random()*2-1)}while(v.lengthSq()<1e-5);return v.normalize()}function randomize(){var ps=[];for(var i=0;i<3;i++){var q,n=0;do{q=unit().multiplyScalar(7+Math.random()*15);n++}while(ps.some(function(p){return p.distanceTo(q)<8})&&n<100);ps.push(q)}B.forEach(function(b,i){b.pos.copy(ps[i]);var r=b.pos.clone().normalize(),ref=Math.abs(r.y)>.88?new THREE.Vector3(1,0,0):new THREE.Vector3(0,1,0),tan=new THREE.Vector3().crossVectors(r,ref).normalize();tan.applyAxisAngle(r,(Math.random()-.5)*1.4);b.vel.copy(tan.multiplyScalar(1+Math.random()*2.3));b.vel.addScaledVector(unit(),.28+Math.random()*.36)});centerP();centerM();clearTrails();syncCfg()}
var GUI=window.lil&&window.lil.GUI?window.lil.GUI:null,gui=null;if(GUI){gui=new GUI({title:'三体控制'});if(innerWidth<600)gui.close();var f=gui.addFolder('物理');f.add(P,'G',.1,25,.05).name('重力常数 G');f.add(P,'softening',.05,5,.01).name('软化 ε');f.add(P,'timeScale',.05,4,.01).name('时间倍率');f.add(P,'pause').name('暂停');var t=gui.addFolder('光轨');t.add(P,'trailLength',50,1800,1).name('轨迹长度');t.add(P,'sampleEvery',1,8,1).name('采样间隔');var v=gui.addFolder('视觉');v.add(P,'bloomStrength',0,5,.01).name('Bloom 强度').onChange(function(x){bloom.strength=x});v.add(P,'bloomRadius',0,1.5,.01).name('Bloom 半径').onChange(function(x){bloom.radius=x});v.add(P,'bloomThreshold',0,1,.01).name('Bloom 阈值').onChange(function(x){bloom.threshold=x});v.add(P,'exposure',.2,2.2,.01).name('曝光').onChange(function(x){renderer.toneMappingExposure=x});v.add(P,'bodyScale',.2,1.3,.01).name('天体尺寸');v.add(P,'autoRotate').name('自动旋转');C.forEach(function(c,i){var x=gui.addFolder('天体 '+c.name);x.add(c,'mass',.5,60,.1).name('质量');x.add(c,'vx',-8,8,.01).name('速度 X').onFinishChange(applyV);x.add(c,'vy',-8,8,.01).name('速度 Y').onFinishChange(applyV);x.add(c,'vz',-8,8,.01).name('速度 Z').onFinishChange(applyV)});var s=gui.addFolder('系统');s.add(P,'randomize').name('🎲 随机生成');s.add(P,'reset').name('↺ 重置');s.add(P,'clearTrails').name('✦ 清空轨迹')}
var last=performance.now(),accum=0;function vis(now){B.forEach(function(b,i){b.mesh.position.copy(b.pos);b.halo.position.copy(b.pos);var r=P.bodyScale*(.65+Math.cbrt(Math.max(.01,b.config.mass))*.42),pulse=1+.08*Math.sin(now*.002+i*2.1);b.mesh.scale.setScalar(r);b.halo.scale.setScalar(r*2.15*pulse);b.halo.material.opacity=.07+.025*pulse})}function animate(now){requestAnimationFrame(animate);var fd=Math.min((now-last)/1000,.05);last=now;controls.autoRotate=P.autoRotate;controls.autoRotateSpeed=.5;controls.update();if(!P.pause){accum+=fd*P.timeScale;var safe=0;while(accum>=P.fixedDt&&safe<45){rk4(P.fixedDt);accum-=P.fixedDt;tick++;safe++;if(tick%Math.max(1,P.sampleEvery|0)===0)for(var i=0;i<3;i++)T[i].add(B[i].pos)}}vis(now);starfield.rotation.y+=fd*.0025;composer.render()}reset();requestAnimationFrame(animate);addEventListener('resize',function(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.6));composer.setSize(innerWidth,innerHeight)})})();
</script>
