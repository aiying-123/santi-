nebula(glowBlue,new THREE.Vector3(-120,18,-130),180,.16);nebula(glowPink,new THREE.Vector3(110,-18,80),210,.12);nebula(glowBlue,new THREE.Vector3(15,45,-180),250,.09);

function Trail(c1,c2){this.p=[];this.g=new THREE.BufferGeometry();this.m=new THREE.ShaderMaterial({transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,vertexShader:'attribute float al;attribute vec3 co;varying float va;varying vec3 vc;void main(){va=al;vc=co;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',fragmentShader:'varying float va;varying vec3 vc;void main(){gl_FragColor=vec4(vc*(1.0+1.8*va),va);}'});this.line=new THREE.Line(this.g,this.m);this.line.frustumCulled=false;scene.add(this.line);this.c1=new THREE.Color(c1);this.c2=new THREE.Color(c2)}

var G=7.5,eps=.82,dt=1/180;function acc(pos){var out=[new THREE.Vector3(),new THREE.Vector3(),new THREE.Vector3()],e2=eps*eps;for(var i=0;i<3;i++)for(var j=i+1;j<3;j++){var r=new THREE.Vector3().subVectors(pos[j],pos[i]),d2=r.lengthSq()+e2,iv=1/Math.sqrt(d2),k=G*iv*iv*iv;out[i].add(r.clone().multiplyScalar(k*bodies[j].m));out[j].add(r.clone().multiplyScalar(-k*bodies[i].m))}return out}

var last=performance.now(),accum=0,tick=0;function frame(now){requestAnimationFrame(frame);var fd=Math.min((now-last)/1000,.05);last=now;accum+=fd;var n=0;while(accum>=dt&&n<50){rk4(dt);accum-=dt;n++;tick++;if(tick%2===0)for(var i=0;i<3;i++)trails[i].add(bodies[i].p)}for(i=0;i<3;i++){var r=.72+Math.cbrt(bodies[i].m)*.42,pulse=1+.08*Math.sin(now*.002+i*2.1);bodies[i].mesh.position.copy(bodies[i].p);bodies[i].mesh.scale.setScalar(r);bodies[i].halo.position.copy(bodies[i].p);bodies[i].halo.scale.set(r*5.2*pulse,r*5.2*pulse,1)}galaxy.rotation.z+=fd*.004;deep.rotation.y+=fd*.0008;if(controls)controls.update();renderer.render(scene,camera)}requestAnimationFrame(frame);
